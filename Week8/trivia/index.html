<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>

            document.addEventListener("DOMContentLoaded", function() {
                // Part 1
                const botao = document.querySelectorAll(".btn");
                botao.forEach(b => {
                    b.addEventListener("click", function() {
                        if (b.dataset.answer === "T") {
                            message = document.querySelector("#message1");
                            message.textContent = "Correct!";
                            message.style.color = "green";
                            b.style.backgroundColor = "green";
                            b.style.color = "white";
                        } else if (b.dataset.answer === "F") {
                            message = document.querySelector("#message1");
                            message.textContent = "Incorrect";
                            message.style.color = "red";
                            b.style.backgroundColor = "red";
                            b.style.color = "white";
                        }
                    });
                });
                // Part 2
                const check = document.querySelector("#check")
                const answer = document.querySelector("#answerText")
                message = document.querySelector("#message2")
                check.addEventListener('click', function() {
                    if (answer.value === "2002"){
                        message.textContent = "Correct!";
                        message.style.color = "green";
                        answer.style.backgroundColor = "green";
                        answer.style.color = "white";
                    } else {
                        message.textContent = "Incorrect";
                        message.style.color = "red";
                        answer.style.backgroundColor = "red";
                        answer.style.color = "white";
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <style>
                    button:hover{
                        border:1px dashed #477bff;
                    }
                </style>
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>What is the value of mechanical energy (Em) in a closed elliptical orbit?</h3>
                <p id="message1"></p>
                <button class="btn" data-answer="F">Em = 0</button>
                <button class="btn" data-answer="F">Em > 0</button>
                <button class="btn" data-answer="T">Em < 0</button>
                <button class="btn" data-answer="F">Em = 1</button>
                <button class="btn" data-answer="F">Em = mv²/2</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>In which year did Brazil win its last World Cup?</h3>
                <p id="message2"></p>
                <input type="text" placeholder="Answer..." id="answerText">
                <button class="btn" id="check">Check</button>
            </div>
        </div>
    </body>
</html>
